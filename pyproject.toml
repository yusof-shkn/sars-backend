[project]
name = "sars-backend"
version = "0.1.0"
description = "NISAR change-detection API (NASA Space Apps 2026 — Dancing with the SARs)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "numpy>=2.0",
    "h5py>=3.11",
    "pyproj>=3.6",
    "pillow>=10.4",
    "earthaccess>=0.19.0",
    "scipy>=1.18.1",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
